<!DOCTYPE HTML>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Counter-Strike: Source</title>
    <style>body {
  font-family: arial;
  margin: 0;
  padding: none;
}

.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
div.emscripten { text-align: center; }
div.emscripten_border { border: 1px solid black; }
/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
canvas.emscripten { border: 0px none; background-color: black; }

#emscripten_logo {
  display: inline-block;
  margin: 0;
  padding: 6px;
  width: 265px;
}

.spinner {
  height: 30px;
  width: 30px;
  margin: 0;
  margin-top: 20px;
  margin-left: 20px;
  display: inline-block;
  vertical-align: top;

  -webkit-animation: rotation .8s linear infinite;
  -moz-animation: rotation .8s linear infinite;
  -o-animation: rotation .8s linear infinite;
  animation: rotation 0.8s linear infinite;

  border-left: 5px solid rgb(235, 235, 235);
  border-right: 5px solid rgb(235, 235, 235);
  border-bottom: 5px solid rgb(235, 235, 235);
  border-top: 5px solid rgb(120, 120, 120);

  border-radius: 100%;
  background-color: rgb(189, 215, 46);
}

@-webkit-keyframes rotation {
  from {-webkit-transform: rotate(0deg);}
  to {-webkit-transform: rotate(360deg);}
}
@-moz-keyframes rotation {
  from {-moz-transform: rotate(0deg);}
  to {-moz-transform: rotate(360deg);}
}
@-o-keyframes rotation {
  from {-o-transform: rotate(0deg);}
  to {-o-transform: rotate(360deg);}
}
@keyframes rotation {
  from {transform: rotate(0deg);}
  to {transform: rotate(360deg);}
}

#status {
  display: inline-block;
  vertical-align: top;
  margin-top: 30px;
  margin-left: 20px;
  font-weight: bold;
  color: rgb(120, 120, 120);
}

#progress {
  height: 20px;
  width: 300px;
}

#controls {
  display: inline-block;
  float: right;
  vertical-align: top;
  margin-top: 30px;
  margin-right: 20px;
}

#output {
  width: 100%;
  height: 200px;
  margin: 0 auto;
  margin-top: 10px;
  border-left: 0px;
  border-right: 0px;
  padding-left: 0px;
  padding-right: 0px;
  display: block;
  background-color: black;
  color: white;
  font-family: 'Lucida Console', Monaco, monospace;
  outline: none;
}
</style>
	<style>
		body {
			background: #111;
			color: #fff;
		}

		/* Fullscreen: the canvas keeps its own drawing-buffer size, so stretch
		   the element to fill the screen and letterbox rather than crop. */
		.emscripten_border:fullscreen,
		canvas:fullscreen {
			width: 100vw;
			height: 100vh;
			border: 0;
			background: #000;
		}
		.emscripten_border:fullscreen canvas {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		/* Left-aligned and inline, as the stock shell had it -- the block plus
		   auto margins is what centred it. The CS:S logo is 769x119, so it is
		   sized by height; HL2's 110px width would leave it 17px tall. */
		body #emscripten_logo {
			height: 44px;
			width: auto;
			display: inline-block;
			margin: 0;
			padding: 6px;
		}

		/* CS:S palette, taken from the game's own resource/clientscheme.res:
		   "Orange" 255 176 0 is the HUD and buy-menu amber, and "OrangeDim" is
		   that amber at 120/255 alpha. The blue was never ours -- it is the
		   browser default for <progress> and for links, so both need rules. */
		:root { --cs-orange: #ffb000; --cs-orange-dim: rgba(255, 176, 0, 0.47); }

		body a { color: var(--cs-orange); }

		#controls input[type=text] {
			width: 12em;
			margin-left: 0.5em;
		}
		#controls label {
			color: var(--cs-orange);
			font-family: system-ui, sans-serif;
			margin-left: 1em;
		}

		#namePrompt {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.85);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			font-family: system-ui, sans-serif;
		}
		/* display:flex above would otherwise beat the hidden attribute. */
		#namePrompt[hidden] { display: none; }
		#namePrompt form {
			background: #1a1a1a;
			border: 1px solid var(--cs-orange-dim);
			padding: 1.5em 2em;
			text-align: center;
		}
		#namePrompt h2 { color: var(--cs-orange); margin: 0 0 0.8em; font-weight: 600; }
		#namePrompt input[type=text] { font-size: 1.1em; width: 14em; padding: 0.3em; }
		#namePrompt input[type=submit] { font-size: 1.1em; margin-left: 0.5em; }

		#status {
			color: var(--cs-orange);
			font-family: system-ui, sans-serif;
			text-align: center;
		}

		/* Native <progress>, left alone apart from the fill colour. */

		/* Spinner: orange leading edge on a dim ring. */
		body .spinner {
			border-left-color: var(--cs-orange-dim) !important;
			border-right-color: var(--cs-orange-dim) !important;
			border-bottom-color: var(--cs-orange-dim) !important;
			border-top-color: var(--cs-orange) !important;
			background-color: transparent !important;
		}
	</style>
  </head>
  <body>
    <div id="namePrompt" hidden>
      <form>
        <h2>Pick a name</h2>
        <input type="text" id="namePromptInput" maxlength="31" placeholder="your name" spellcheck="false" required>
        <input type="submit" value="Play">
      </form>
    </div>
    <img id="emscripten_logo" src="https://cdn.jsdelivr.net/gh/sussyahhblud/CS-S@main/assets/cs-s-logo.png" alt="Counter-Strike: Source">

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="button" value="Fullscreen" onclick="goFullscreen()"></span>
      <label for="playerName">Name</label><input type="text" id="playerName" maxlength="31" placeholder="your name" spellcheck="false">
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      // Keys typed into the page's own inputs (the Name box, the name prompt)
      // belong to them. SDL listens on window in the capture phase and cancels
      // most keys, so letters never reached the box. Same target, same phase,
      // registered before the game loads: this runs first and keeps SDL out.
      ['keydown', 'keypress', 'keyup'].forEach(function (type) {
        window.addEventListener(type, function (e) {
          var t = e.target;
          if (t && t.tagName === 'INPUT' && t.type === 'text') e.stopImmediatePropagation();
        }, true);
      });

      // Fullscreen, via the DOM only.
      //
      // NEVER touch Module.requestFullscreen here. It is not in
      // EXPORTED_RUNTIME_METHODS, and emscripten installs a *throwing getter*
      // for unexported runtime methods - so merely reading the property calls
      // abort() and takes the whole runtime down with it. Even
      // `typeof Module.requestFullscreen === 'function'` is enough to kill it.
      //
      // Exporting it would not help anyway: this build hands the canvas to a
      // worker with OFFSCREENCANVASES_TO_PTHREAD, and emscripten's resizeCanvas
      // path sets canvas.width/height, which throws on a transferred canvas.
      //
      // So: put the container into fullscreen and let CSS scale it. The engine
      // keeps rendering at its own resolution (Options > Video) and the browser
      // upscales, which is what the canvas is doing at windowed size regardless.
      function goFullscreen() {
        var el = document.querySelector('.emscripten_border') ||
                 document.getElementById('canvas');
        if (!el) {
          console.error('fullscreen: no target element');
          return;
        }
        var req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen || el.msRequestFullscreen;
        if (!req) {
          console.error('fullscreen: not supported by this browser');
          return;
        }
        var r = req.call(el);
        if (r && typeof r.then === 'function') {
          r.then(lockKeyboard).catch(function (e) {
            console.error('fullscreen request rejected:', e);
          });
        } else {
          lockKeyboard();
        }
      }

      // Keyboard Lock sends browser shortcuts (Ctrl+W, Ctrl+T, Ctrl+N, F11, Esc)
      // to the page instead of the browser, so they no longer interrupt play.
      // Only permitted while fullscreen and on a secure context - localhost
      // counts as secure. Chrome then requires HOLDING Esc to leave fullscreen,
      // which is exactly the behaviour we want.
      function lockKeyboard() {
        if (!navigator.keyboard || !navigator.keyboard.lock) {
          console.warn('keyboard lock: not supported by this browser');
          return;
        }
        navigator.keyboard.lock().catch(function (e) {
          console.warn('keyboard lock refused:', e);
        });
      }

      // Always release it on the way out, including when the browser exits
      // fullscreen on its own.
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement &&
            navigator.keyboard && navigator.keyboard.unlock) {
          navigator.keyboard.unlock();
        }
      });

      // Player name. Multiplayer has no Steam name, so without this everyone is
      // "unnamed". Saved in this browser; pre.js passes it on the command line,
      // and a change while playing is sent to the engine as a name command.
      (function () {
        var box = document.getElementById('playerName');
        if (!box) return;
        var clean = function (s) { return String(s || '').replace(/["';\\\r\n]/g, '').trim().slice(0, 31); };
        try { box.value = clean(localStorage.getItem('cs_player_name')); } catch (e) {}
        var apply = function () {
          var name = clean(box.value);
          box.value = name;
          try { localStorage.setItem('cs_player_name', name); } catch (e) {}
          if (name && window.Module) (Module.csPageCommands = Module.csPageCommands || []).push('name "' + name + '"');
        };
        // Used by pre.js: the saved name, and a prompt that holds the game until
        // a name is given.
        window.csSavedName = function () { try { return clean(localStorage.getItem('cs_player_name')); } catch (e) { return ''; } };
        window.csAskName = function (done) {
          var prompt = document.getElementById('namePrompt');
          var input = document.getElementById('namePromptInput');
          prompt.hidden = false;
          input.focus();
          input.addEventListener('keydown', function (e) { e.stopPropagation(); });
          prompt.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();
            var name = clean(input.value);
            if (!name) return;
            try { localStorage.setItem('cs_player_name', name); } catch (err) {}
            box.value = name;
            prompt.hidden = true;
            done(name);
          });
        };
        box.addEventListener('change', apply);
        // Typing in the box must not also move the player.
        box.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') box.blur(); });
      })();

      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

	  canvasElement.widthNative = screen.availWidth
	  canvasElement.heightNative = screen.availHeight

      var Module = {
        csSavedName: function () { return window.csSavedName ? window.csSavedName() : ''; },
        csAskName: function (done) { if (window.csAskName) window.csAskName(done); else done('player'); },
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          // if this is a progress update, skip it if too soon
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = (event) => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    <script>window.CS_FILES_BASE = "https://cdn.jsdelivr.net/gh/sussyahhblud/CS-S@main/";</script>
    <script async crossorigin="anonymous" type="text/javascript" src="https://cdn.jsdelivr.net/gh/sussyahhblud/CS-S@main/cs_launcher.js"></script>
  </body>
</html>
